description: 'Raya (legal entity Raya App Inc) is a private, membership-based global community for
  dating, friendship, and professional networking, founded by Daniel Gendelman in 2014 and launched
  in February 2015 out of Los Angeles, California. Membership is application-only: applications are
  reviewed on an ongoing basis by a global committee, an Instagram handle is required for identity
  verification, and accepted members choose a 1, 6, or 12 month paid subscription. The product is
  iOS-only (App Store id 957215308, minimum iOS 17.0) and is known for photo-slideshow profiles set
  to music, screenshot detection, and a community drawn heavily from creative industries. Public
  sources report roughly $15.5M raised from investors including Cowboy Ventures, Dreamers VC and
  S32, and the company appears on secondary marketplaces such as Forge Global and EquityZen. It is a
  consumer application company, not an API provider: enrichment probed rayatheapp.com, raya.co,
  api.rayatheapp.com, api.raya.co and icecream.rayatheapp.com and found no developer portal, no
  documentation, no OpenAPI/GraphQL/AsyncAPI contract, no MCP server, and no A2A agent card. The
  api.rayatheapp.com host is a private first-party mobile backend that returns 404 to every
  unauthenticated path. This profile is identity-only pending a public API surface.'
